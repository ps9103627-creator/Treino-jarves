<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino Jarvis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0A111D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#0A111D;--panel:#111C2E;--line:#22324D;--tx:#E6EEF9;--mute:#8A9BB5;--gold:#F0B33C;--cy:#5ADBFF;--ok:#2FBF8A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--tx);font:400 16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 170px}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;margin:0;letter-spacing:.01em}
h1{font-size:34px;font-weight:700}h2{font-size:26px}h3{font-size:21px;font-weight:600}
.mute{color:var(--mute)}
.seg{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:12px;margin:14px 0}
.seg button{flex:1;padding:10px;border:0;border-radius:9px;background:none;color:var(--mute);font:600 15px Barlow,sans-serif}
.seg button.on{background:var(--gold);color:#1a1200}
.card{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;color:var(--tx);font:inherit}
.card b{font:700 24px 'Barlow Condensed',sans-serif;display:block}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.back{background:none;border:0;color:var(--cy);font:600 15px Barlow,sans-serif;padding:0 0 8px}
.ex{border-top:1px solid var(--line);padding:16px 0}
.tip{margin:4px 0 6px;color:var(--mute);font-size:15px}
.ex a{color:var(--cy);font-size:14px}
.set{display:flex;align-items:center;gap:8px;margin-top:10px}
.set>span:first-child{width:62px;color:var(--mute);font-size:14px}
.set input{width:64px;padding:9px;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--tx);font:600 16px Barlow,sans-serif;text-align:center}
.set button{margin-left:auto;width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font-size:18px}
.set.ok button{background:var(--ok);border-color:var(--ok);color:#04150e}
.last{font-size:13px;color:var(--gold)}
.hist{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.hist svg{width:100%;height:46px;margin-top:6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,17,29,.96);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{flex:1;padding:14px 4px;background:none;border:0;color:var(--mute);font:600 15px Barlow,sans-serif}
.nav button.on{color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
#rest{position:fixed;left:12px;right:12px;bottom:calc(58px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--gold);color:#1a1200;border-radius:14px;padding:10px 14px;display:none;align-items:center;gap:10px;z-index:6}
#rest strong{font:700 30px 'Barlow Condensed',sans-serif;margin-right:auto}
#rest button{background:#1a1200;color:var(--gold);border:0;border-radius:8px;padding:8px 12px;font:600 14px Barlow,sans-serif}
.orbwrap{display:grid;place-items:center;padding:20px 0 6px}
.orb{width:132px;height:132px;border-radius:50%;border:2px solid var(--line);background:radial-gradient(circle,#0e2a3d 0 38%,var(--panel) 40%);color:var(--cy);font:700 17px 'Barlow Condensed',sans-serif;position:relative}
.orb.on{border-color:var(--cy);box-shadow:0 0 0 8px rgba(90,219,255,.08),0 0 28px rgba(90,219,255,.35);animation:p 2.2s ease-in-out infinite}
@keyframes p{50%{box-shadow:0 0 0 18px rgba(90,219,255,.04),0 0 40px rgba(90,219,255,.5)}}
@media(prefers-reduced-motion:reduce){.orb.on{animation:none}}
.status{text-align:center;color:var(--mute);margin:8px 0 14px;min-height:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:8px 12px;font:500 14px Barlow,sans-serif}
.msg{margin:8px 0;padding:10px 12px;border-radius:12px;max-width:88%}
.msg.u{background:var(--panel);margin-left:auto}
.msg.j{border:1px solid var(--cy);color:var(--tx)}
.msg a{display:inline-block;margin-top:6px;color:var(--cy)}
.cmd{display:flex;gap:8px;margin-top:12px}
.cmd input{flex:1;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:16px Barlow,sans-serif}
.cmd button{padding:0 16px;border:0;border-radius:10px;background:var(--cy);color:#02222e;font:600 15px Barlow,sans-serif}
.small{font-size:13px;color:var(--mute)}
.clear{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:8px 12px;margin-top:8px;font:500 14px Barlow,sans-serif}
</style>
</head>
<body>
<main><div id="app"></div><div id="ytbox" style="display:none;margin-top:14px"><div id="ytp"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="clear" data-act="vdn">Volume −</button><button class="clear" data-act="vup">Volume +</button><button class="clear" data-act="ytclose">Fechar player</button></div></div></main>
<div id="rest" role="timer"><span>Descanso</span><strong id="rt">0:00</strong><button data-act="plus">+15s</button><button data-act="stop">Parar</button></div>
<nav class="nav"><button data-tab="w">Treinos</button><button data-tab="h">Evolução</button><button data-tab="j">Jarvis</button></nav>
<script>
const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const X={};
const def=(id,n,tip,kw)=>X[id]={n,tip,kw:norm(kw||n)};
def('flex','Flexão','Corpo alinhado, cotovelos a 45°. Desça até o peito quase tocar o chão.');
def('agpc','Agachamento livre','Pés na largura dos ombros, quadril para trás, joelhos acompanhando a ponta dos pés.');
def('ava','Avanço','Passo largo, joelho de trás quase no chão, tronco ereto.');
def('barra','Barra fixa','Pegada um pouco acima dos ombros. Suba até o queixo passar a barra, sem balançar.');
def('reel','Remada com elástico','Elástico preso à frente, puxe os cotovelos para trás juntando as escápulas.');
def('deel','Desenvolvimento com elástico','Pise no elástico e empurre as mãos acima da cabeça sem arquear a lombar.');
def('abel','Abdução com elástico','Elástico acima dos joelhos, abra as pernas de forma controlada.');
def('suph','Supino com halteres','Deitado, desça os halteres até a linha do peito e empurre sem bater um no outro.');
def('reh','Remada unilateral','Apoie uma mão no banco, puxe o halter em direção ao quadril.');
def('gob','Agachamento goblet','Halter junto ao peito, desça entre os joelhos mantendo a coluna neutra.');
def('rosca','Rosca direta','Cotovelos colados ao tronco; suba sem balançar o corpo.');
def('supr','Supino reto','Escápulas firmes no banco, barra toca o peito e sobe em linha reta.','supino reto');
def('supi','Supino inclinado','Banco a 30°, desça a barra na parte alta do peito.');
def('dese','Desenvolvimento','Sentado, empurre acima da cabeça sem arquear a lombar.');
def('trip','Tríceps na corda','Cotovelos fixos ao lado do corpo, abra a corda no final.','triceps');
def('puxf','Puxada frontal','Puxe a barra até a clavícula, peito aberto, sem jogar o tronco.');
def('recu','Remada curvada','Tronco inclinado, coluna neutra, puxe a barra em direção ao umbigo.');
def('face','Face pull','Corda na altura do rosto, puxe abrindo os cotovelos.');
def('agac','Agachamento','Barra apoiada nas costas, desça até a coxa ficar paralela ao chão.','agachamento');
def('legp','Leg press','Pés na largura dos ombros, desça sem tirar o quadril do banco.');
def('stif','Stiff','Joelhos levemente flexionados, quadril para trás, barra rente às pernas.');
def('exte','Cadeira extensora','Estenda os joelhos sem travar e desça devagar.');
const R={
 home:{'Calistenia':[['flex',3,12],['agpc',4,15],['ava',3,10],['barra',3,6]],
  'Elásticos':[['reel',3,15],['deel',3,12],['abel',3,15]],
  'Halteres':[['suph',3,10],['reh',3,10],['gob',3,12],['rosca',3,12]]},
 gym:{'Push (empurrar)':[['supr',4,8],['supi',3,10],['dese',3,10],['trip',3,12]],
  'Pull (puxar)':[['puxf',4,10],['recu',3,10],['rosca',3,12],['face',3,15]],
  'Legs (pernas)':[['agac',4,8],['legp',3,12],['stif',3,10],['exte',3,12]]}
};
let S={tab:'w',place:'home',r:null,cmd:false};
let logs=[];try{logs=JSON.parse(localStorage.getItem('fit.logs')||'[]')}catch(e){}
const persist=()=>{try{localStorage.setItem('fit.logs',JSON.stringify(logs))}catch(e){}};
const lastOf=id=>[...logs].reverse().find(l=>l.ex===id);
const addLog=(ex,kg,reps)=>{logs.push({ex,kg,reps,t:Date.now()});persist()};
const yt=n=>'https://www.youtube.com/results?search_query='+encodeURIComponent('como fazer '+n+' execução correta');

/* ---------- descanso ---------- */
let rt={end:0,iv:null};
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();setTimeout(()=>o.stop(),400)}catch(e){}}
function startRest(sec){rt.end=Date.now()+sec*1000;$('#rest').style.display='flex';clearInterval(rt.iv);rt.iv=setInterval(tick,250);tick()}
function tick(){const l=Math.ceil((rt.end-Date.now())/1000);if(l<=0){stopRest();beep();say('Descanso concluído, senhor.');return}$('#rt').textContent=Math.floor(l/60)+':'+String(l%60).padStart(2,'0')}
function stopRest(){clearInterval(rt.iv);$('#rest').style.display='none'}

/* ---------- telas ---------- */
function viewW(){
 let h='<h1>Treinos</h1><div class="seg"><button data-place="home" class="'+(S.place==='home'?'on':'')+'">Em casa</button><button data-place="gym" class="'+(S.place==='gym'?'on':'')+'">Academia</button></div>';
 if(!S.r){
  h+='<p class="mute">'+(S.place==='home'?'Peso do corpo, elásticos e halteres.':'Divisão Push / Pull / Legs, com foco em carga e repetições.')+'</p>';
  for(const k in R[S.place])h+='<button class="card" data-r="'+k+'"><b>'+k+'</b><span class="mute">'+R[S.place][k].length+' exercícios</span></button>';
  return h}
 h+='<button class="back" data-act="back">‹ Voltar</button><h2>'+S.r+'</h2>';
 for(const [id,sets,reps] of R[S.place][S.r]){
  const x=X[id],l=lastOf(id);
  h+='<section class="ex"><h3>'+x.n+'</h3>'+(l?'<div class="last">Última carga: '+l.kg+' kg × '+l.reps+'</div>':'')+'<p class="tip">'+x.tip+'</p><a href="'+yt(x.n)+'" target="_blank" rel="noopener">Ver execução em vídeo</a>';
  for(let i=0;i<sets;i++)h+='<div class="set" data-ex="'+id+'"><span>Série '+(i+1)+'</span><input type="number" inputmode="decimal" data-f="kg" value="'+(l?l.kg:0)+'" aria-label="Carga em kg"><span class="small">kg</span><input type="number" inputmode="numeric" data-f="reps" value="'+reps+'" aria-label="Repetições"><span class="small">reps</span><button data-act="set" aria-label="Concluir série">✓</button></div>';
  h+='</section>'}
 return h}
function spark(v){if(v.length<2)return'';const mx=Math.max(...v),mn=Math.min(...v),d=mx-mn||1;
 const p=v.map((y,i)=>(i/(v.length-1)*300).toFixed(1)+','+(42-((y-mn)/d)*36).toFixed(1)).join(' ');
 return '<svg viewBox="0 0 300 46" preserveAspectRatio="none"><polyline points="'+p+'" fill="none" stroke="#F0B33C" stroke-width="2.5"/></svg>'}
function viewH(){
 let h='<h1>Evolução</h1>';
 if(!logs.length)return h+'<p class="mute">Nenhuma série registrada ainda. Conclua uma série em Treinos ou peça ao Jarvis: “anote que fiz 12 repetições com 20 kg no agachamento”.</p>';
 const ids=[...new Set(logs.map(l=>l.ex))];
 for(const id of ids){const ls=logs.filter(l=>l.ex===id),kgs=ls.map(l=>l.kg),best=Math.max(...kgs);
  h+='<div class="hist"><h3>'+(X[id]?X[id].n:id)+'</h3><span class="mute">Maior carga: '+best+' kg · '+ls.length+' séries</span>'+spark(kgs.slice(-14))+'</div>'}
 h+='<h3 style="margin-top:18px">Últimos registros</h3>';
 for(const l of [...logs].reverse().slice(0,10))h+='<div class="row"><span>'+(X[l.ex]?X[l.ex].n:l.ex)+'</span><span>'+l.kg+' kg × '+l.reps+' <span class="small">'+new Date(l.t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span></span></div>';
 return h+'<button class="clear" data-act="clear">Apagar histórico</button>'}
let chat=[];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let listening=false,rec=null,speaking=false;
function viewJ(){
 let h='<h1>Jarvis</h1><div class="orbwrap"><button class="orb '+(listening?'on':'')+'" data-act="mic" aria-pressed="'+listening+'">'+(listening?'Escutando':'Ativar')+'</button></div><div class="status" id="st">'+(listening?'Diga “Jarvis” para chamar.':(SR?'Toque para ativar a escuta contínua.':'Este navegador não tem reconhecimento de voz. Use o campo de texto.'))+'</div>';
 h+='<div class="chips">'+['Jarvis, inicie o cronômetro de descanso de 60 segundos','Jarvis, anote que fiz 12 repetições com 20 kg no agachamento','Jarvis, pesquise no Google qual a melhor substituição para o supino reto','Jarvis, coloque a minha playlist de treino'].map(c=>'<button data-ex-cmd="'+c+'">'+c.replace('Jarvis, ','')+'</button>').join('')+'</div><div id="chat">'+chatHtml()+'</div>';
 return h+'<div class="cmd"><input id="ti" placeholder="Digite um comando" aria-label="Comando"><button data-act="send">Enviar</button></div><p class="small">A escuta funciona enquanto esta página estiver aberta. Se o microfone for bloqueado, abra o link em tela cheia e permita o acesso.</p>'+musPanel()+aiPanel()+vpPanel()}
const chatHtml=()=>chat.map(m=>'<div class="msg '+m.w+'">'+m.t.replace(/</g,'&lt;')+(m.l?'<br><a href="'+m.l+'" target="_blank" rel="noopener">Abrir</a>':'')+'</div>').join('');
function msg(w,t,l){chat.push({w,t,l});const c=$('#chat');if(c)c.innerHTML=chatHtml()}
function render(){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
 $('#app').innerHTML=S.tab==='w'?viewW():S.tab==='h'?viewH():viewJ()}

/* ---------- voz ---------- */
function say(t){msg('j',t);if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('pt'));if(v)u.voice=v;u.rate=.95;u.pitch=.8;speaking=true;u.onend=u.onerror=()=>setTimeout(()=>speaking=false,500);speechSynthesis.speak(u)}
function status(t){const s=$('#st');if(s)s.textContent=t}
const NUM={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,dez:10,quinze:15,vinte:20,trinta:30,quarenta:40,sessenta:60,noventa:90};
function findEx(t){return Object.keys(X).sort((a,b)=>X[b].kw.length-X[a].kw.length).find(id=>t.includes(X[id].kw))}
function handle(raw){
 let t=norm(raw).replace(/\b(um|uma|dois|duas|tres|quatro|cinco|seis|dez|quinze|vinte|trinta|quarenta|sessenta|noventa)\b/g,m=>NUM[m]);
 let m;
 if(m=t.match(/(\d+)\s*(segundo|minuto)/)&&/cronometro|timer|descanso|temporizador/.test(t)){m=t.match(/(\d+)\s*(segundo|minuto)/);const s=+m[1]*(m[2]==='minuto'?60:1);startRest(s);return{text:'Cronômetro de '+(s>=60&&s%60===0?s/60+' minuto'+(s>60?'s':''):s+' segundos')+' iniciado, senhor.'}}
 if(m=t.match(/(\d+)\s*repeticoe?s?.*?(\d+(?:[.,]\d+)?)\s*(?:kg|quilos?)/)){
  const id=findEx(t);if(!id)return{text:'Não identifiquei o exercício, senhor.'};
  const kg=parseFloat(m[2].replace(',','.')),reps=+m[1];addLog(id,kg,reps);if(S.tab==='h')render();
  return{text:'Anotado, senhor: '+reps+' repetições com '+kg+' quilos em '+X[id].n+'.'}}
 if(m=raw.match(/pesquis\w*\s+(?:no google\s+)?(.+)/i)){const q=m[1].trim(),l='https://www.google.com/search?q='+encodeURIComponent(q);return{text:'Pesquisando “'+q+'” no Google, senhor.',link:l}}
 const urlM=raw.match(/https?:\/\/\S*(?:youtube\.com|youtu\.be)\S*/i);
 if(urlM)return{text:'Abrindo o link, senhor.',sp:{k:'url',u:urlM[0]}};
 if(/volume|\bsom\b|mais (alto|baixo|forte)|mudo|silenci/.test(t)){
  const num=t.match(/(\d+)/),dir=/aument|sobe|suba|eleve|elevar|mais (alto|forte)/.test(t)?1:/diminu|abaix|reduz|baix|menos/.test(t)?-1:0;
  if(dir)return{text:'Ajustando o volume, senhor.',sp:{k:'volrel',d:dir*(num?+num[1]:15)}};
  if(num)return{text:'Ajustando o volume, senhor.',sp:{k:'vol',v:Math.min(100,+num[1])}};
  if(/maximo/.test(t))return{text:'Volume máximo, senhor.',sp:{k:'vol',v:100}};
  if(/mudo|silenci|zerar/.test(t))return{text:'Silenciando, senhor.',sp:{k:'vol',v:0}}}
 if(/pausar|pause|pare a musica|para a musica|parar a musica/.test(t))return{text:'Pausando, senhor.',sp:{k:'pause'}};
 if(/proxima (musica|faixa|video)|pular (a )?musica/.test(t))return{text:'Próxima faixa, senhor.',sp:{k:'next'}};
 const MV='toque|tocar|coloque|coloca|ponha|bota|reproduza|reproduzir|assista|assistir';
 if(new RegExp('playlist|musica|video|\\b('+MV+')\\b').test(t)){
  let q='playlist de treino';
  if(!/playlist/.test(t)&&(m=raw.match(new RegExp('(?:'+MV+')\\s+(.+)','i'))))q=m[1].replace(/\s*no (spotify|youtube)\s*$/i,'').trim();
  return{text:'Abrindo “'+q+'” no YouTube, senhor.',link:'https://www.youtube.com/results?search_query='+encodeURIComponent(q),sp:{k:/playlist/.test(t)?'playlist':'track',q}}}
 return{ai:true}}
async function run(raw){msg('u',raw);const r=handle(raw);if(r.sp){try{say(await ytAction(r.sp))}catch(e){say(e.message)}return}if(r.ai){await askAI(raw);return}say(r.text);if(r.link){msg('j','Link pronto.',r.link);try{window.open(r.link,'_blank','noopener')}catch(e){}}}
function heard(raw){
 if(speaking||S.enr)return;
 const wk=/jarvis/i.test(raw);
 if((wk||S.cmd)&&vpOn()){const r=vpCheck();if(!r.ok){if(wk)say('Voz não reconhecida, senhor.');msg('j','Verificação de voz negada'+(r.d?' (distância '+r.d.toFixed(2)+', limite '+r.lim.toFixed(2)+')':': '+r.why)+'.');return}}
 if(wk){const rest=raw.replace(/.*?jarvis[,.!\s]*/i,'').trim();
  if(rest.length>3)run(rest);else{say('Olá, senhor. O que você precisa?');S.cmd=true;status('Pode falar…');clearTimeout(S.ct);S.ct=setTimeout(()=>{S.cmd=false;status('Diga “Jarvis” para chamar.')},10000)}}
 else if(S.cmd){S.cmd=false;run(raw);status('Diga “Jarvis” para chamar.')}}
function toggleMic(){
 if(!SR){render();return}
 if(listening){listening=false;try{rec.stop()}catch(e){}vmStop();render();return}
 rec=new SR();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=false;
 rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)heard(e.results[i][0].transcript)};
 rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;render();status('Microfone bloqueado. Permita o acesso ou use o campo de texto.')}};
 rec.onend=()=>{if(listening)setTimeout(()=>{try{rec.start()}catch(e){}},300)};
 listening=true;if(vpOn())vmStart().catch(()=>msg('j','Não consegui iniciar a verificação de voz, senhor.'));try{rec.start()}catch(e){}render()}

const ls={g:k=>{try{return localStorage.getItem(k)||''}catch(e){return''}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},d:k=>{try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- IA (Claude Haiku, resposta em streaming) ---------- */
let hist=[],pend=0;
function sayq(t){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('pt'));if(v)u.voice=v;u.rate=1;u.pitch=.8;speaking=true;pend++;u.onend=u.onerror=()=>{pend--;if(pend<=0)setTimeout(()=>{if(pend<=0)speaking=false},500)};speechSynthesis.speak(u)}
const sys=()=>'Você é o JARVIS, assistente de voz de um app de treino. Responda sempre em português do Brasil, de forma direta e cortês, chamando o usuário de "senhor". Suas respostas são faladas em voz alta: no máximo 3 frases curtas, sem listas, sem markdown e sem emojis. Se a pergunta for sobre treino, use o histórico do usuário quando ajudar. Últimas séries do usuário: '+(logs.slice(-12).map(l=>(X[l.ex]?X[l.ex].n:l.ex)+' '+l.kg+'kg x'+l.reps).join('; ')||'nenhuma')+'.';
async function askAI(q){
 const key=ls.g('gm.key');
 if(!key){say('Preciso da chave do Gemini, senhor. Configure no quadro Inteligência, na aba Jarvis.');return}
 hist.push({role:'user',content:q});
 const m={w:'j',t:'…'};chat.push(m);
 const upd=()=>{const c=$('#chat');if(c)c.innerHTML=chatHtml()};upd();
 try{
  const mdl=ls.g('gm.model')||'gemini-flash-latest';
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(mdl)+':streamGenerateContent?alt=sse',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:sys()}]},contents:hist.map(h=>({role:h.role==='assistant'?'model':'user',parts:[{text:h.content}]})),generationConfig:{maxOutputTokens:1024}})});
  if(!r.ok)throw new Error(r.status===400?'O Gemini recusou o pedido, senhor. Confira se a chave está correta.':r.status===403?'A chave do Gemini não tem permissão, senhor. Crie uma nova no Google AI Studio.':r.status===404?'O modelo '+mdl+' não foi encontrado, senhor. Troque o nome do modelo no quadro Inteligência.':r.status===429?'Atingimos o limite gratuito do Gemini, senhor. Tente de novo em instantes.':'O Gemini retornou o erro '+r.status+'.');
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',full='',sp='';
  while(true){
   const {done,value}=await rd.read();if(done)break;
   buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
   for(const ln of lines){
    if(!ln.startsWith('data:'))continue;
    let j;try{j=JSON.parse(ln.slice(5))}catch(e){continue}
    const tx=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).filter(x=>x.text&&!x.thought).map(x=>x.text).join('');
    if(tx){
     full+=tx;sp+=tx;m.t=full;upd();
     let k;while((k=sp.search(/[.!?](\s|$)/))>=0&&k<sp.length-1){sayq(sp.slice(0,k+1));sp=sp.slice(k+1).trimStart()}}}}
  if(sp.trim())sayq(sp);
  hist.push({role:'assistant',content:full});hist=hist.slice(-8);
 }catch(e){
  hist.pop();chat.splice(chat.indexOf(m),1);
  say(e instanceof TypeError?'Não consegui falar com a IA, senhor. Verifique a conexão.':e.message)}}
const aiPanel=()=>'<div class="hist" style="margin-top:12px"><h3>Inteligência (Gemini)</h3><p class="small">'+(ls.g('gm.key')?'Chave salva neste aparelho. O Jarvis responde qualquer pergunta que não seja um comando.':'Cole a chave do Gemini (aistudio.google.com/apikey) para o Jarvis responder qualquer pergunta.')+'</p><div class="cmd"><input id="aikey" type="password" autocomplete="off" placeholder="AIza..." aria-label="Chave do Gemini"><button data-act="aisave">Salvar</button></div><div class="cmd"><input id="gmmodel" placeholder="Modelo (padrão: gemini-flash-latest)" value="'+ls.g('gm.model')+'" aria-label="Modelo do Gemini"></div>'+(ls.g('gm.key')?'<div class="cmd"><button data-act="aiout" style="background:var(--panel);color:var(--tx);border:1px solid var(--line)">Remover chave</button></div>':'')+'</div>';

/* ---------- YouTube (grátis) ---------- */
let ytP=null,ytRd=null;
function ytErr(e){
 const c=e.data,vid=(ytP.getVideoData&&ytP.getVideoData().video_id)||'',pl=ytP.getPlaylist&&ytP.getPlaylist();
 if((c===100||c===101||c===150)&&pl&&pl.length>1){ytP.nextVideo();return}
 say(c===101||c===150?'O dono deste vídeo não permite tocá-lo aqui, senhor. Deixei o link para abrir no YouTube.':c===100?'Este vídeo não está disponível, senhor.':'O player do YouTube apresentou o erro '+c+', senhor.');
 if(vid&&c!==100)msg('j','Abrir no YouTube.','https://www.youtube.com/watch?v='+vid)}
function ytLoad(){
 if(ytRd)return ytRd;
 ytRd=Promise.race([new Promise(res=>{
  const mk=()=>{ytP=new YT.Player('ytp',{width:'100%',height:200,playerVars:Object.assign({playsinline:1,rel:0},location.protocol.startsWith('http')?{origin:location.origin}:{}),events:{onReady:()=>res(ytP),onError:ytErr}})};
  if(window.YT&&YT.Player)mk();else{window.onYouTubeIframeAPIReady=mk;if(!document.getElementById('ytapi')){const t=document.createElement('script');t.id='ytapi';t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t)}}
 }),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Não consegui carregar o player do YouTube, senhor. Verifique a conexão.')),10000))]);
 ytRd.catch(()=>{ytRd=null});return ytRd}
const ytShow=()=>{$('#ytbox').style.display='block'};
function ytId(u){const r={};try{const x=new URL(u);r.list=x.searchParams.get('list');r.v=x.searchParams.get('v')||(x.hostname==='youtu.be'?x.pathname.slice(1):'')}catch(e){r.list=u.trim()}return r}
async function ytPlay(u){
 const id=ytId(u);
 if(!(id.list&&!/^RD/.test(id.list))&&!id.v)return false;
 ytShow();const p=await ytLoad();
 if(id.list&&!/^RD/.test(id.list))p.loadPlaylist({list:id.list,listType:'playlist'});else p.loadVideoById(id.v);
 return true}
async function ytAction(sp){
 const k=sp.k;
 if(k==='pause'){if(ytP)ytP.pauseVideo();return'Pausado, senhor.'}
 if(k==='next'){if(ytP)ytP.nextVideo();return'Próxima faixa, senhor.'}
 if(k==='vol'||k==='volrel'){
  if(/iPhone|iPad/.test(navigator.userAgent))return'No iPhone o volume só muda pelos botões do aparelho, senhor.';
  if(!ytP||!ytP.getVolume)return'Não há nada tocando agora, senhor.';
  const v=k==='vol'?sp.v:Math.max(0,Math.min(100,ytP.getVolume()+sp.d));
  ytP.setVolume(v);return'Volume em '+v+' por cento, senhor.'}
 if(k==='url')return(await ytPlay(sp.u))?'Tocando o link, senhor.':'Esse link parece inválido, senhor.';
 if(k==='playlist'){
  const u=ls.g('yt.pl');if(!u)return'Cadastre o link da sua playlist no quadro Música, senhor.';
  return(await ytPlay(u))?'Tocando sua playlist de treino, senhor.':'O link da playlist parece inválido, senhor.'}
 const key=ls.g('yt.key');
 if(!key){const l='https://www.youtube.com/results?search_query='+encodeURIComponent(sp.q);msg('j','Busca pronta.',l);try{window.open(l,'_blank','noopener')}catch(e){}return'Para escolher músicas pelo nome, preciso da chave de busca do YouTube, senhor. Abri a busca. Se preferir, cole o link do vídeo no quadro Música.'}
 const r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=1&q='+encodeURIComponent(sp.q)+'&key='+encodeURIComponent(key));
 if(!r.ok)throw new Error('A busca do YouTube falhou, senhor. Confira a chave e se a YouTube Data API está ativada.');
 const j=await r.json(),it=j.items&&j.items[0];if(!it)return'Não encontrei esse vídeo, senhor.';
 const d=document.createElement('textarea');d.innerHTML=it.snippet.title;
 ytShow();const p=await ytLoad();p.loadVideoById(it.id.videoId);return'Tocando '+d.value+'.'}
const musPanel=()=>'<div class="hist" style="margin-top:18px"><h3>Música e vídeos (YouTube)</h3><p class="small">Tocar agora: nome da música/vídeo ou link do YouTube.</p><div class="cmd"><input id="ytnow" placeholder="Eye of the Tiger ou https://youtu.be/..." aria-label="Tocar agora"><button data-act="ytnow">Tocar</button></div><p class="small" style="margin-top:12px">Link da sua playlist de treino:</p><div class="cmd"><input id="ytpl" placeholder="https://www.youtube.com/playlist?list=..." value="'+ls.g('yt.pl')+'" aria-label="Link da playlist"></div><p class="small" style="margin-top:12px">Chave do YouTube Data API (para tocar pelo nome)'+(ls.g('yt.key')?' — já salva':'')+':</p><div class="cmd"><input id="ytkey" type="password" autocomplete="off" placeholder="AIza..." aria-label="Chave do YouTube"><button data-act="ytsave">Salvar</button></div></div>';

/* ---------- Trava por voz (beta): impressão de voz simples ---------- */
let vm=null,vbuf=[],vlen=0,vpt='',en={s:[]};
async function vmStart(){
 if(vm)return;
 const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
 const ac=new (window.AudioContext||window.webkitAudioContext)(),src=ac.createMediaStreamSource(st),pr=ac.createScriptProcessor(4096,1,1);
 pr.onaudioprocess=e=>{if(speaking||S.enr){if(speaking){vbuf=[];vlen=0;return}}const d=new Float32Array(e.inputBuffer.getChannelData(0));vbuf.push(d);vlen+=d.length;while(vbuf.length>1&&vlen-vbuf[0].length>ac.sampleRate*6)vlen-=vbuf.shift().length};
 src.connect(pr);pr.connect(ac.destination);ac.resume();vm={st,ac,pr}}
function vmStop(){if(vm){vm.st.getTracks().forEach(t=>t.stop());try{vm.ac.close()}catch(e){}vm=null;vbuf=[];vlen=0}}
const snap=sec=>{const all=new Float32Array(vlen);let o=0;for(const c of vbuf){all.set(c,o);o+=c.length}return all.slice(Math.max(0,all.length-Math.floor(vm.ac.sampleRate*sec)))};
function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}
 for(let l=2;l<=n;l<<=1){const a=-2*Math.PI/l;for(let i=0;i<n;i+=l)for(let k=0;k<l/2;k++){const c=Math.cos(a*k),s=Math.sin(a*k),x=i+k,y=x+l/2,tr=re[y]*c-im[y]*s,ti=re[y]*s+im[y]*c;re[y]=re[x]-tr;im[y]=im[x]-ti;re[x]+=tr;im[x]+=ti}}}
function vfeat(x,sr){
 const d=Math.max(1,Math.round(sr/12000)),sr2=sr/d,n=Math.floor(x.length/d),y=new Float32Array(n);
 for(let i=0;i<n;i++){let a=0;for(let k=0;k<d;k++)a+=x[i*d+k];y[i]=a/d}
 const N=256,H=128,B=20,w=Array.from({length:N},(_,i)=>.5-.5*Math.cos(2*Math.PI*i/(N-1)));
 const mel=f=>2595*Math.log10(1+f/700),imel=m=>700*(Math.pow(10,m/2595)-1),lo=mel(100),hi=mel(Math.min(5500,sr2/2-100)),pts=[];
 for(let i=0;i<B+2;i++)pts.push(Math.min(N/2-1,Math.floor(N*imel(lo+(hi-lo)*i/(B+1))/sr2)));
 const fr=[];for(let o=0;o+N+171<=n;o+=H){let e=0;for(let i=0;i<N;i++)e+=y[o+i]*y[o+i];fr.push({o,r:Math.sqrt(e/N)})}
 if(fr.length<20)return null;
 const sr_=fr.map(f=>f.r).sort((a,b)=>a-b),thr=Math.max(.004,sr_[Math.floor(sr_.length*.9)]*.3),V=fr.filter(f=>f.r>thr);
 if(V.length<40)return null;
 const C=[],F=[];
 for(const f of V){
  const re=new Float64Array(N),im=new Float64Array(N);for(let i=0;i<N;i++)re[i]=y[f.o+i]*w[i];fft(re,im);
  const p=re.map((v,i)=>v*v+im[i]*im[i]),le=[];
  for(let b=0;b<B;b++){const l=pts[b],c=pts[b+1],r=pts[b+2];let e=0;for(let k=l;k<=r;k++)e+=(k<=c?(c===l?1:(k-l)/(c-l)):(r===c?1:(r-k)/(r-c)))*p[k];le.push(Math.log(e+1e-10))}
  const cc=[];for(let j=1;j<=12;j++){let a=0;for(let b=0;b<B;b++)a+=le[b]*Math.cos(Math.PI*j*(b+.5)/B);cc.push(a/B)}C.push(cc);
  let r0=0;for(let i=0;i<512&&f.o+i+171<n;i++)r0+=y[f.o+i]*y[f.o+i];let best=0,bl=0;
  for(let l=30;l<=171;l++){let a=0;for(let i=0;i<512&&f.o+i+l<n;i++)a+=y[f.o+i]*y[f.o+i+l];if(a/r0>best){best=a/r0;bl=l}}
  if(best>.4&&bl)F.push(sr2/bl)}
 if(F.length<8)return null;
 const m=[],sd=[];for(let j=0;j<12;j++){const col=C.map(c=>c[j]),mu=col.reduce((a,b)=>a+b,0)/col.length;m.push(mu);sd.push(Math.sqrt(col.reduce((a,b)=>a+(b-mu)**2,0)/col.length))}
 F.sort((a,b)=>a-b);return{m:m.concat(sd),f:F[F.length>>1]}}
function vdist(a,p){let z=0;for(let i=0;i<24;i++){const q=Math.max(p.s[i],.15*Math.abs(p.m[i]),.3);z+=((a.m[i]-p.m[i])/q)**2}return Math.sqrt(z/24+(12*Math.log2(a.f/p.f)/4)**2)}
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
function prof(A){const m=[],s=[];for(let i=0;i<24;i++){const c=A.map(a=>a.m[i]),mu=mean(c);m.push(mu);s.push(Math.sqrt(mean(c.map(v=>(v-mu)**2))))}const fs=A.map(a=>a.f).sort((a,b)=>a-b);return{m,s,f:fs[fs.length>>1]}}
const vpOn=()=>ls.g('vp.on')==='1'&&!!ls.g('vp.p');
function vpCheck(){
 const p=JSON.parse(ls.g('vp.p')||'null');if(!p)return{ok:true};
 if(!vm)return{ok:false,why:'sem microfone de verificação'};
 const f=vfeat(snap(6),vm.ac.sampleRate);if(!f)return{ok:false,why:'áudio curto ou baixo demais'};
 const d=vdist(f,p),lim=p.thr*[1.3,1.7,2.2][+ls.g('vp.t')||1];return{ok:d<=lim,d,lim}}
const VPH=['Jarvis, inicie o cronômetro de descanso de 60 segundos','Jarvis, anote que fiz 12 repetições com 20 quilos no agachamento','Jarvis, coloque a minha playlist de treino','Jarvis, aumente o volume','Jarvis, qual a melhor substituição para o supino reto'];
const vpMsg=t=>{vpt=t;const e=$('#vpst');if(e)e.textContent=t};
async function vpRecord(){
 if(S.enr)return;S.enr=true;
 try{await vmStart()}catch(e){S.enr=false;vpMsg('Não consegui acessar o microfone. Permita o acesso e tente de novo.');return}
 vbuf=[];vlen=0;vpMsg('Gravando por 4 segundos… diga: '+VPH[en.s.length]);
 await new Promise(r=>setTimeout(r,4000));
 const f=vfeat(snap(4),vm.ac.sampleRate);S.enr=false;
 if(!f){vpMsg('Não ouvi bem, senhor. Fale mais perto e mais alto e tente de novo.');if(!listening)vmStop();return}
 en.s.push(f);
 if(en.s.length<5){vpMsg('Amostra '+en.s.length+'/5 salva. Próxima frase: '+VPH[en.s.length]);render();return}
 const A=en.s;let mx=0;for(let i=0;i<A.length;i++)mx=Math.max(mx,vdist(A[i],prof(A.filter((_,j)=>j!==i))));
 const pf=prof(A);pf.thr=Math.max(1,mx);ls.s('vp.p',JSON.stringify(pf));ls.s('vp.on','1');en={s:[]};vpt='Voz cadastrada, senhor.';
 if(!listening)vmStop();render()}
const vpPanel=()=>{const has=!!ls.g('vp.p'),on=vpOn(),t=+ls.g('vp.t')||1,off='background:var(--panel);color:var(--tx);border:1px solid var(--line)';
 return '<div class="hist" style="margin-top:12px"><h3>Trava por voz (beta)</h3><p class="small">'+(has?(on?'Ligada: o Jarvis só obedece à voz cadastrada. Comandos digitados não passam pela trava.':'Voz cadastrada, trava desligada.'):'Cadastre sua voz com 5 frases para o Jarvis ignorar outras vozes. Fique num lugar silencioso.')+'</p>'
 +(has?'':'<p class="small" id="vpst">'+(vpt||'Frase 1: '+VPH[0])+'</p><div class="cmd"><button data-act="vprec">Gravar amostra '+(en.s.length+1)+'/5</button></div>')
 +(has?'<div class="cmd"><button data-act="vptog">'+(on?'Desligar trava':'Ligar trava')+'</button><button data-act="vptol" style="'+off+'">Tolerância: '+['baixa','normal','alta'][t]+'</button></div><div class="cmd"><button data-act="vpdel" style="'+off+'">Apagar e recadastrar</button></div>':'')
 +'<p class="small">Aviso: é um filtro simples, não uma segurança forte. Uma gravação da sua voz ou uma voz muito parecida pode passar, e a verificação pode errar com barulho ou rouquidão. Se o Jarvis não te reconhecer, aumente a tolerância.</p></div>'};

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){S.tab=b.dataset.tab;render();return}
 if(b.dataset.place){S.place=b.dataset.place;S.r=null;render();return}
 if(b.dataset.r){S.r=b.dataset.r;render();return}
 if(b.dataset.exCmd){run(b.dataset.exCmd.replace(/^Jarvis,\s*/,''));return}
 const a=b.dataset.act;
 if(a==='back'){S.r=null;render()}
 else if(a==='set'){const row=b.closest('.set');addLog(row.dataset.ex,parseFloat(row.querySelector('[data-f=kg]').value)||0,parseInt(row.querySelector('[data-f=reps]').value)||0);row.classList.add('ok');startRest(S.place==='gym'?90:60)}
 else if(a==='plus'){rt.end+=15000;tick()}
 else if(a==='stop')stopRest();
 else if(a==='mic')toggleMic();
 else if(a==='send'){const i=$('#ti');if(i.value.trim()){run(i.value.replace(/^jarvis[,\s]*/i,''));i.value=''}}
 else if(a==='ytsave'){ls.s('yt.pl',$('#ytpl').value.trim());const k=$('#ytkey').value.trim();if(k)ls.s('yt.key',k);render()}
 else if(a==='vprec')vpRecord()
 else if(a==='vptog'){if(vpOn())ls.s('vp.on','0');else{ls.s('vp.on','1');if(listening)vmStart().catch(()=>{})}render()}
 else if(a==='vptol'){ls.s('vp.t',String(((+ls.g('vp.t')||1)+1)%3));render()}
 else if(a==='vpdel'&&confirm('Apagar sua voz cadastrada?')){ls.d('vp.p');ls.d('vp.on');en={s:[]};vpt='';if(!listening)vmStop();render()}
 else if(a==='ytnow'){const v=$('#ytnow').value.trim();if(v)run(/youtu/i.test(v)?v:'toque '+v)}
 else if(a==='vup'||a==='vdn'){ytAction({k:'volrel',d:a==='vup'?15:-15}).catch(()=>{})}
 else if(a==='ytclose'){if(ytP)ytP.pauseVideo();$('#ytbox').style.display='none'}
 else if(a==='aisave'){const v=$('#aikey').value.trim();if(v)ls.s('gm.key',v);ls.s('gm.model',$('#gmmodel').value.trim());render()}
 else if(a==='aiout'){ls.d('gm.key');hist=[];render()}
 else if(a==='clear'&&confirm('Apagar todo o histórico?')){logs=[];persist();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ti')document.querySelector('[data-act=send]').click();if(e.key==='Enter'&&e.target.id==='ytnow')document.querySelector('[data-act=ytnow]').click()});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
